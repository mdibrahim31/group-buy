name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_PASSWORD: ${{ vars.VITE_ADMIN_PASSWORD || secrets.VITE_ADMIN_PASSWORD || vars.ADMIN_PASSWORD || secrets.ADMIN_PASSWORD || vars.PASSWORD || secrets.PASSWORD }}
        run: |
          echo "Setting up environment variables for build..."
          touch .env
          if [ -n "${VITE_SUPABASE_URL}" ]; then
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}" >> .env
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}" >> .env
            echo "Successfully injected Supabase environment variables into .env"
          else
            echo "NOTICE: VITE_SUPABASE_URL is not set in GitHub Actions variables/secrets."
          fi
          if [ -n "${VITE_ADMIN_PASSWORD}" ]; then
            echo "VITE_ADMIN_PASSWORD=${VITE_ADMIN_PASSWORD}" >> .env
            echo "Successfully injected VITE_ADMIN_PASSWORD into .env"
          else
            echo "NOTICE: VITE_ADMIN_PASSWORD is not set in GitHub Actions variables/secrets."
          fi
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
